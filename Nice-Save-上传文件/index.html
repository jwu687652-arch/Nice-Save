<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日记账</title>
<meta name="description" content="可爱风的每日记账：分类统计、月预算钱罐、扫小票自动拆账。">
<meta name="theme-color" content="#FFF5F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700;800&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one phone-shaped app column (framed on desktop), scrolling screen + bottom tab bar, bottom sheets and a full-screen month-end overlay. Cute: soft peach-pink, round shapes, a piggy bank mascot. */
:root{
  --desk:#F7E6E1; --bg:#FFF5F2; --surface:#FFFFFF; --surface2:#FFEAE4; --ink:#3B2A33; --muted:#8E7581; --line:#F1DAD4;
  --accent:#FF7A9C; --accent-ink:#FFFFFF; --good:#2F9E62; --warn:#D9861C; --bad:#DB4B57; --heat:#FF6F93;
  --shadow:0 6px 22px rgba(214,110,135,.14); --pig:#FFB8CA; --pig2:#FF9BB5; --pig3:#D9637F; --gold:#FFC93C; --gold2:#DE9A10;
  --f-display:'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --f-num:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#140F13; --bg:#1E171C; --surface:#2A2027; --surface2:#372A33; --ink:#F7EAEF; --muted:#B89FAB; --line:#45353F;
  --accent:#FF8FAE; --accent-ink:#2B0F19; --good:#5BCB8C; --warn:#F0B24E; --bad:#FF7A84; --heat:#FF7A9C;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#140F13; --bg:#1E171C; --surface:#2A2027; --surface2:#372A33; --ink:#F7EAEF; --muted:#B89FAB; --line:#45353F;
  --accent:#FF8FAE; --accent-ink:#2B0F19; --good:#5BCB8C; --warn:#F0B24E; --bad:#FF7A84; --heat:#FF7A9C;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){
  body{padding-block:20px}
  .app{border-radius:34px;box-shadow:0 20px 60px rgba(120,60,80,.18);border:1px solid var(--line)}
}
.screen{flex:1;overflow-y:auto;padding-top:14px;padding-bottom:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:2px 0 0;line-height:1.15;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;line-height:1.2}
.proto{font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:4px 9px;border-radius:99px;white-space:nowrap}

.card{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.link{color:var(--accent);font-weight:700;font-size:13px}

/* ring */
.ring-wrap{position:relative;width:210px;max-width:100%;aspect-ratio:1;margin:0 auto}
.ring-wrap svg{width:100%;height:100%;display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-center .big{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1}
.ring-center .sub{font-size:12px;color:var(--muted);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,var(--surface));font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* progress */
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .4s}
.bar.stack>i{border-radius:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kv .num{font-size:22px;font-weight:700}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;text-align:left;width:100%;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.bubble{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 22%,var(--surface));flex:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--muted)}
.row-amt{font-weight:700;font-size:16px}

/* segmented + nav */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:99px;padding:4px}
.seg button{padding:8px 0;border-radius:99px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button.arr{width:36px;height:36px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:18px;font-weight:800}
.nav .lbl{font-weight:800;font-size:15px}

/* week bars */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:200px;padding-top:6px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bval{font-size:10px;color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.bstack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--surface2);position:relative}
.bstack i{display:block;width:100%}
.bstack.clip::after{content:"";position:absolute;left:0;right:0;top:8px;height:6px;background:repeating-linear-gradient(135deg,var(--surface) 0 3px,transparent 3px 6px)}
.bstack.future{background:transparent;border:2px dashed var(--line);height:20px}
.bday{font-size:12px;font-weight:800;color:var(--muted)}
.bday.today{color:var(--accent)}

/* heatmap */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:800}
.cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--heat) var(--p,0%),var(--surface2));max-width:100%}
.cell.hot{color:#fff}
.cell.future{background:transparent;border:1.5px dashed var(--line);color:var(--muted);cursor:default}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell small{font-size:9px;font-family:var(--f-num);font-weight:500;opacity:.85;line-height:1}
.heat-key{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end}
.heat-key i{width:14px;height:14px;border-radius:4px;display:block;background:color-mix(in srgb,var(--heat) var(--p),var(--surface2))}

/* breakdown */
.bd{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center}
.bd .e{font-size:18px;grid-row:span 2}
.bd .n{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.bd .a{font-weight:700;grid-row:span 2;text-align:right;font-family:var(--f-num)}
.insight{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:18px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.insight b{font-family:var(--f-display);font-weight:400;color:var(--accent);flex:none}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hl>div{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.hl .num{font-size:20px;font-weight:700}
.toplist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;counter-reset:t}
.toplist li{display:flex;align-items:center;gap:10px;font-size:13px}
.toplist li::before{counter-increment:t;content:counter(t);font-family:var(--f-num);font-weight:700;width:22px;height:22px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:12px;flex:none}
.toplist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.plus{width:54px;height:54px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:700;margin:-22px auto 0;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);display:grid;place-items:center;line-height:1}

/* sheet */
.veil{position:absolute;inset:0;background:rgba(45,20,32,.38);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sheet{background:var(--surface);width:100%;border-radius:28px 28px 0 0;max-height:94%;overflow-y:auto;padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.9,.3,1.1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.amt{font-family:var(--f-num);font-weight:700;font-size:44px;text-align:center;line-height:1.1}
.amt .cur{font-size:24px;color:var(--muted);margin-right:2px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:700;border:2px solid transparent;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.cat .em{font-size:20px}
.cat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input{flex:1;min-width:0;background:var(--surface2);border:0;border-radius:14px;padding:11px 12px}
.pill{padding:7px 12px;border-radius:99px;background:var(--surface2);font-weight:700;font-size:12px}
.pill.on{background:var(--ink);color:var(--surface)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:50px;border-radius:16px;background:var(--surface2);font-family:var(--f-num);font-size:22px;font-weight:700}
.key:active{transform:scale(.96)}
.btn{height:50px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px}
.from-receipt{font-size:12px;background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}

/* receipt */
.drop{border:2.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:24px;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:color-mix(in srgb,var(--accent) 6%,var(--surface));cursor:pointer}
.drop .ic{font-size:40px}
.scan{position:relative;width:150px;height:200px;margin:10px auto;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.scan i{display:block;height:6px;border-radius:3px;background:var(--surface2)}
.scan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.scan::after{content:"";position:absolute;left:0;right:0;height:36px;background:linear-gradient(transparent,color-mix(in srgb,var(--accent) 45%,transparent));animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:-36px}to{top:100%}}
.ritem{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ritem:last-child{border-bottom:0}
.ritem input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);grid-row:span 2}
.raw{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.mem{font-size:10px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:1px 6px;border-radius:99px}
.price{width:76px;text-align:right;background:var(--surface2);border:0;border-radius:10px;padding:6px 8px;font-family:var(--f-num);font-weight:700;grid-row:span 2}
.catbtn{grid-column:2;justify-self:start;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink)}
.catbtn::after{content:"▾";font-size:10px;color:var(--muted)}
.batch{position:sticky;bottom:0;background:var(--ink);color:var(--surface);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.batch .mini{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.batch .mini button{flex:none;background:color-mix(in srgb,var(--c) 30%,var(--ink));color:var(--surface);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}
.check{border-radius:16px;padding:10px 12px;font-weight:700;font-size:13px}
.check.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.check.no{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:14px;padding:10px 12px}

/* budget */
.jar-row{display:flex;gap:16px;align-items:center}
.jar{width:120px;flex:none}
.jar svg{width:100%;display:block}
.jar-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.jar-info .num.big{font-size:32px;font-weight:700;line-height:1}
.subb{display:grid;grid-template-columns:28px 1fr 84px;gap:6px 10px;align-items:center}
.subb .e{font-size:18px;grid-row:span 2}
.subb input{grid-row:span 2;width:100%;background:var(--surface2);border:0;border-radius:10px;padding:7px 8px;text-align:right;font-family:var(--f-num);font-weight:700}
.subb .n{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.vault{display:flex;align-items:center;gap:14px}
.coin{width:46px;height:46px;border-radius:50%;background:var(--gold);border:3px solid var(--gold2);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:#7A4D00;font-size:20px;flex:none}
.mems{display:flex;flex-direction:column;gap:6px}
.mems div{display:flex;justify-content:space-between;gap:10px;font-size:12px}

/* overlay */
.overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding-top:24px;padding-bottom:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));animation:fade .3s}
.overlay.save{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--gold) 40%,var(--bg)),var(--bg) 70%)}
.overlay.over{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,#8FB8FF 35%,var(--bg)),var(--bg) 70%)}
.stage{position:relative;width:230px;height:250px}
.stage svg{position:absolute;left:5px;top:40px;width:220px}
.stage .c{position:absolute;left:50%;top:95px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--gold);border:3px solid var(--gold2);font-family:var(--f-num);font-weight:700;color:#7A4D00;display:grid;place-items:center;font-size:14px;opacity:0;animation:drop 1.3s ease-in infinite}
@keyframes drop{0%{transform:translateY(-110px) rotate(-30deg);opacity:0}15%{opacity:1}75%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(10px) scaleX(.3);opacity:0}}
.pig-bounce{animation:bounce 1.3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bounce{0%,70%,100%{transform:scale(1,1)}80%{transform:scale(1.05,.94)}90%{transform:scale(.98,1.03)}}
.tear{animation:tear 1.4s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.pig-sad{animation:wobble 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.ov-k{font-family:var(--f-display);font-size:22px}
.ov-n{font-family:var(--f-num);font-weight:700;font-size:54px;line-height:1}
.overlay.save .ov-n{color:var(--gold2)}
.overlay.over .ov-n{color:var(--bad)}
.ov-t{max-width:300px;line-height:1.6;color:var(--muted);font-weight:600}
.overlay .btns{width:100%;max-width:320px;margin-top:10px}
.v2{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-left:4px;vertical-align:middle}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:99px;font-weight:700;z-index:40;white-space:nowrap;animation:fade .2s;box-shadow:var(--shadow)}

/* ---------- interaction layer ---------- */
.screen{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.sheet{-webkit-user-select:none;user-select:none}
.screen input,.sheet input{-webkit-user-select:text;user-select:text}
.top{position:relative}
/* pacing: press = quick squash (90ms), release = springy overshoot; entrances ≤ 0.6s total */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.2,.8,.3,1)}
.btn,.cat,.tab,.key,.pill,.arr,.plus,.catbtn,.cell,.jar,.lg,.bcol,.bd{transition:transform .32s var(--spring)}
.btn:active,.cat:active,.pill:active,.arr:active,.catbtn:active,.cell:active,.lg:active,.bd:active{transform:scale(.94);transition-duration:.09s}
.key:active{transform:scale(.9);transition-duration:.07s;background:color-mix(in srgb,var(--accent) 22%,var(--surface2))}
.plus:active{transform:scale(.88) rotate(90deg);transition-duration:.12s}
.bump{animation:bump .2s var(--spring)}
@keyframes bump{40%{transform:scale(1.08)}}
.shake{animation:shake .3s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}

/* page enter: children stagger in, charts draw themselves */
.screen.enter>*{animation:pageIn .3s var(--out) both}
.screen.enter>*:nth-child(2){animation-delay:.03s}
.screen.enter>*:nth-child(3){animation-delay:.06s}
.screen.enter>*:nth-child(4){animation-delay:.09s}
.screen.enter>*:nth-child(5){animation-delay:.12s}
.screen.enter>*:nth-child(n+6){animation-delay:.15s}
.screen.slide-l>*:nth-child(n+4){animation:slideL .24s var(--out) both}
.screen.slide-r>*:nth-child(n+4){animation:slideR .24s var(--out) both}
@keyframes slideL{from{opacity:0;transform:translateX(28px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-28px)}}
.sweep{stroke-dasharray:100 0;animation:sweep .7s .05s cubic-bezier(.4,.1,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 100}}
.screen.enter .bar>i,.screen.slide-l .bar>i,.screen.slide-r .bar>i{animation:grow .55s .12s var(--out) both}
@keyframes grow{from{width:0}}
.screen.enter .bstack,.screen.slide-l .bstack,.screen.slide-r .bstack{transform-origin:50% 100%;animation:rise .45s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms + .08s)}
@keyframes rise{from{transform:scaleY(0)}}
.screen.enter .cell,.screen.slide-l .cell,.screen.slide-r .cell{animation:pop .3s var(--spring) both;animation-delay:calc(var(--i,0) * 8ms + .06s)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.screen.enter .ritem{animation:pageIn .28s both;animation-delay:calc(var(--i,0) * 45ms + .05s)}
.tab.jump svg{animation:tabPop .35s var(--spring)}
@keyframes tabPop{40%{transform:translateY(-4px) scale(1.18)}}

/* chart interaction */
[hidden]{display:none!important}
.seg{cursor:pointer;transition:opacity .25s,stroke-width .3s var(--spring)}
.seg.dim{opacity:.18}
.seg.hi{stroke-width:34px}
.lg{border:0;cursor:pointer;transition:opacity .25s,transform .32s var(--spring)}
.lg.dim,.bd.dim{opacity:.3}
.lg.hi{box-shadow:0 0 0 2px var(--c)}
.bd{cursor:pointer;transition:opacity .25s}
.bstack i{transition:opacity .25s}
.bstack i.dim{opacity:.15}
.focus-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface))}
.tip{position:absolute;z-index:45;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 12px;font-size:12px;min-width:150px;pointer-events:none;box-shadow:var(--shadow);animation:tipIn .18s var(--spring)}
.tip b{display:block;font-size:13px;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:5px}
@keyframes tipIn{from{opacity:.4;transform:translateY(6px) scale(.95)}}
.bcol.lift .bstack{box-shadow:0 0 0 2px var(--ink)}
.cell.lift{box-shadow:0 0 0 2px var(--ink)}
.bcol,.cell{-webkit-touch-callout:none}
.bars.has-tip .bcol:not(.lift){opacity:.45}

/* rows: swipe left to delete */
.swipe{position:relative;border-bottom:1px dashed var(--line);overflow:hidden}
.swipe:last-child{border-bottom:0}
.swipe .row{border-bottom:0;background:var(--surface);position:relative;z-index:1;transition:transform .25s cubic-bezier(.2,.8,.3,1);touch-action:pan-y}
.swipe.open .row{transform:translateX(-84px)}
.swipe .del{position:absolute;right:0;top:6px;bottom:6px;width:76px;border-radius:14px;background:var(--bad);color:#fff;font-weight:800}
.swipe.flash .row{animation:flash 1.5s ease-out}
@keyframes flash{0%{transform:translateX(-24px);opacity:0;background:color-mix(in srgb,var(--accent) 24%,var(--surface))}30%{transform:none;opacity:1;background:color-mix(in srgb,var(--accent) 24%,var(--surface))}100%{background:var(--surface)}}

/* sheet: drag to dismiss, exit animation */
.sheet-top{display:flex;flex-direction:column;gap:12px;touch-action:none;cursor:grab}
.out{pointer-events:none}
.veil.out{animation:fadeOut .22s forwards}
.veil.out .sheet{animation:down .22s ease-in forwards}
.overlay.out{animation:fadeOut .22s forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
.amt{color:color-mix(in srgb,var(--c,var(--ink)) 75%,var(--ink));transition:color .2s}
.cat .em{display:inline-block}
.cat.pop .em{animation:popEm .38s}
@keyframes popEm{40%{transform:scale(1.4) rotate(-10deg)}}
.flycoin{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--gold);border:3px solid var(--gold2);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:#7A4D00;font-size:13px;z-index:50;pointer-events:none}

/* mascot */
.mascot{width:72px;flex:none;margin-top:-6px;position:relative}
.mascot svg{width:100%;display:block;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 95%;overflow:visible}
.mascot.poke svg,.stage.jump svg{animation:jump .55s var(--spring)}
.mascot.eat svg{animation:eat .5s var(--spring)}
@keyframes eat{30%{transform:scale(1.16,.84)}65%{transform:scale(.95,1.07)}}
.eyes{animation:look 7s ease-in-out infinite}
@keyframes look{0%,40%,100%{transform:translateX(0)}46%,58%{transform:translateX(-4px)}64%,78%{transform:translateX(4px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--warn)}
@keyframes breathe{50%{transform:scale(1.035,.97)}}
@keyframes jump{30%{transform:translateY(-14px) rotate(-6deg)}65%{transform:translateY(0) scale(1.1,.9)}}
.say{position:absolute;right:0;top:calc(100% + 4px);background:var(--ink);color:var(--surface);padding:8px 12px;border-radius:14px;font-size:12px;font-weight:700;white-space:nowrap;z-index:5;animation:pageIn .2s}
.say::before{content:"";position:absolute;right:28px;top:-4px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}

/* jar water + month-end confetti */
.wave{animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(60px)}}
.bub{animation:bub 2.6s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}30%{opacity:.6}100%{transform:translateY(-40px);opacity:0}}
.screen.enter .water{animation:drain .9s .1s var(--out) both}
@keyframes drain{from{transform:translateY(calc(-1 * var(--off)))}}
.jar svg{transform-origin:50% 90%}
.jar.slosh svg{animation:slosh .7s}
@keyframes slosh{20%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.overlay{overflow:hidden}
.confetti{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;animation:fall 2.6s linear infinite}
@keyframes fall{to{transform:translateY(900px) rotate(600deg)}}
.stage{cursor:pointer}

.toast{display:flex;align-items:center;gap:14px}
.undo{color:var(--accent);font-weight:800}

.drop.off{opacity:.55;cursor:not-allowed}
.btn[disabled]{opacity:.45}
.field .small{flex:none}
body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.app{padding-top:env(safe-area-inset-top,0px)}
@media (min-width:520px){.app{padding-top:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stage .c{opacity:1}}
</style>
</head>
<body>

<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="layer"></div>
</div>

<script>
/* ---------- basics ---------- */
const CATS=[
  {id:'groc',name:'超市日用',emoji:'🛒',color:'#4FB477'},
  {id:'sport',name:'运动健身',emoji:'🏋️',color:'#14A9BD'},
  {id:'trans',name:'交通',emoji:'🚌',color:'#4A7FE8'},
  {id:'home',name:'居住',emoji:'🏠',color:'#B07D52'},
  {id:'shop',name:'购物',emoji:'🛍',color:'#F46FA6'},
  {id:'fun',name:'娱乐',emoji:'🎮',color:'#9877EC'},
  {id:'health',name:'医疗健康',emoji:'💊',color:'#EB5757'},
  {id:'food',name:'餐饮外卖',emoji:'🍜',color:'#FF9A3D'},
  {id:'other',name:'其他',emoji:'📦',color:'#A39E96'},
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const WD=['一','二','三','四','五','六','日'];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const wdIdx=s=>(pd(s).getDay()+6)%7;
const mondayOf=s=>addDays(s,-wdIdx(s));
const dim=(y,m)=>new Date(y,m,0).getDate();
const monthRange=(y,m)=>[`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${pad(dim(y,m))}`];
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const r2=n=>Math.round(n*100)/100;
const money=(n,dec=2)=>(n<0?'-':'')+'$'+Math.abs(Number(n)).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>{const d=pd(s);return `${d.getMonth()+1}月${d.getDate()}日`};
const ymOf=s=>{const d=pd(s);return [d.getFullYear(),d.getMonth()+1]};
const monthOf=s=>s.slice(0,7);
let TODAY=ds(new Date());
const newId=(()=>{let last=0;return()=>{let id=Date.now()*100+Math.floor(Math.random()*100);if(id<=last)id=last+1;last=id;return id}})();

/* ---------- state ---------- */
let records=[];
const S={tab:'today',statsMode:'day',statsDate:TODAY,weekStart:mondayOf(TODAY),ym:ymOf(TODAY),
  budget:3000,sub:{},vault:0,vaultLog:[],settled:{},memory:{},
  receipt:null,selected:new Set(),draft:null,sync:'local',confirm:''};
function add(date,cat,amount,note,extra={}){const r={id:newId(),date,cat,amount:r2(amount),note,...extra};records.push(r);touch(date);return r}

/* ---------- storage ----------
   Everything lives on this device (localStorage). Use 导出备份 regularly — it's the only copy. */
const LS_KEY='ledger.web.v1',SCAN_KEY='ledger.scan.v1',BACKUP_KEY='ledger.lastBackup';
function touch(date){}
function touchSettings(){}
const settingsBody=()=>({budget:S.budget,sub:S.sub,vault:S.vault,vaultLog:S.vaultLog,settled:S.settled,memory:S.memory});
function validRecord(r){return r&&typeof r.id==='number'&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&CAT[r.cat]&&typeof r.amount==='number'&&isFinite(r.amount)}
function applyData(d){
  records=Array.isArray(d.records)?d.records.filter(validRecord):[];
  S.budget=d.budget>0?d.budget:3000;S.sub=d.sub&&typeof d.sub==='object'?d.sub:{};S.vault=+d.vault||0;
  S.vaultLog=Array.isArray(d.vaultLog)?d.vaultLog:[];S.settled=d.settled&&typeof d.settled==='object'?d.settled:{};S.memory=d.memory&&typeof d.memory==='object'?d.memory:{};
}
let saveFailed=false;
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({records,...settingsBody()}));saveFailed=false}
  catch(e){if(!saveFailed)toast('保存失败：手机存储空间不足，先导出备份');saveFailed=true}
}
function loadLocal(){try{const t=localStorage.getItem(LS_KEY);if(t){const d=JSON.parse(t);applyData(d);return d}}catch(e){}return null}
function commit(){saveLocal()}
const SYNC_TEXT={local:'💾 保存在这台设备'};
function setSync(s){S.sync=s}
let READY=false,BOOTED=false;
function afterReady(){
  if(READY)return;READY=true;
  const st=checkSettle();
  if(st)setTimeout(()=>showSettle(st),500);
}
// Ask the browser not to clear our data when space runs low (granted silently on most installed PWAs).
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- backup ---------- */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function lastBackupDays(){const t=+lsGet(BACKUP_KEY);return t?Math.floor((Date.now()-t)/864e5):null}
async function exportBackup(){
  const body=JSON.stringify({app:'ledger',version:1,exportedAt:new Date().toISOString(),records,...settingsBody()},null,1);
  const name=`记账备份-${TODAY}.json`,file=new File([body],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});lsSet(BACKUP_KEY,String(Date.now()));toast('备份已导出');render();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  lsSet(BACKUP_KEY,String(Date.now()));toast('备份已下载');render();
}
let pendingImport=null;
function pickImport(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{const d=JSON.parse(fr.result);if(!d||d.app!=='ledger'||!Array.isArray(d.records))throw 0;
      pendingImport=d;S.confirm='import';render();
    }catch(e){toast('这不是记账备份文件')}
  };
  fr.readAsText(f);
}
function doImport(){if(!pendingImport)return;applyData(pendingImport);pendingImport=null;S.confirm='';commit();S.tab='today';S.enter=true;render();toast(`已恢复 ${records.length} 笔记录`)}

/* ---------- install (Add to Home Screen) ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(BOOTED&&S.tab==='budget')render()});
addEventListener('appinstalled',()=>{installEvt=null;toast('已安装到桌面')});
async function doInstall(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()}
function installCard(){
  if(isStandalone())return '';
  if(installEvt)return `<section class="card"><div class="card-h"><h2>装到手机桌面</h2></div><span class="muted small">像 App 一样全屏打开，没网也能用。</span><button class="btn" onclick="doInstall()">安装</button></section>`;
  if(isIOS())return `<section class="card"><h2>装到手机桌面</h2><span class="muted small">用 Safari 打开这个页面 → 点底部的分享按钮 → 「添加到主屏幕」。之后从桌面图标打开，就像 App 一样全屏，没网也能用。</span></section>`;
  return '';
}

/* ---------- queries ---------- */
const inRange=(a,b)=>records.filter(r=>r.date>=a&&r.date<=b);
const total=rs=>r2(rs.reduce((s,r)=>s+r.amount,0));
const catMap=rs=>{const m={};rs.forEach(r=>m[r.cat]=(m[r.cat]||0)+r.amount);return m};
const byCat=rs=>{const m=catMap(rs);return CATS.filter(c=>m[c.id]).map(c=>({...c,value:r2(m[c.id])})).sort((a,b)=>b.value-a.value)};

/* ---------- pieces ---------- */
let ringN=0;
function ring(parts,value,sub,dec=2){
  const size=200,stroke=26,r=(size-stroke)/2,C=2*Math.PI*r,t=parts.reduce((s,p)=>s+p.value,0);
  let segs='',off=0;
  if(t>0){
    const gap=parts.length>1?3:0;
    parts.forEach(p=>{const len=p.value/t*C;const vis=Math.max(.5,len-gap);
      segs+=`<circle class="seg" data-cat="${p.id}" data-v="${p.value}" onclick="focusCat('${p.id}')" cx="100" cy="100" r="${r}" fill="none" stroke="${p.color}" stroke-width="${stroke}" stroke-linecap="butt" stroke-dasharray="${vis} ${C-vis}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len});
  }
  const anim=S.enter||S.slide,mid='rm'+(++ringN),from=S.ringFrom;
  const mask=anim?`<mask id="${mid}"><circle cx="100" cy="100" r="${r}" fill="none" stroke="#fff" stroke-width="${stroke+14}" pathLength="100" class="sweep" transform="rotate(-90 100 100)"/></mask>`:'';
  return `<div class="ring-wrap" data-total="${value}" data-dec="${dec}" data-sub="${esc(sub)}"><svg viewBox="0 0 200 200" role="img" aria-label="分类占比，点一块只看这个分类" style="overflow:visible">${mask}<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/><g${anim?` mask="url(#${mid})"`:''}>${segs}</g></svg>
  <div class="ring-center"><div class="big" data-count="${value}" data-cur="${value}" data-dec="${dec}"${from!=null?` data-from="${from}" data-delay="450"`:''}>${money(value,dec)}</div><div class="sub">${sub}</div></div></div>`;
}
const legend=parts=>`<div class="legend">${parts.map(p=>`<button class="lg" data-cat="${p.id}" onclick="focusCat('${p.id}')" style="--c:${p.color}"><span class="dot"></span>${p.name} <span class="num">${money(p.value)}</span></button>`).join('')}</div>`;
const focusBar=()=>`<div class="focus-bar" hidden><span></span><button class="link" onclick="focusCat(S.focus)">显示全部</button></div>`;
function row(r){const c=CAT[r.cat];
  return `<div class="swipe${S.flash===r.id?' flash':''}" data-cat-row="${r.cat}"><button class="del" onclick="swipeDel(this,${r.id})" tabindex="-1">删除</button><button class="row" onclick="rowTap(this,${r.id})"><span class="bubble" style="--c:${c.color}">${c.emoji}</span>
  <span class="row-main"><span class="row-title">${esc(r.note||c.name)}</span><span class="row-sub">${c.name}${r.items?` · ${r.items.length} 件商品`:''}</span></span>
  <span class="row-amt num">-${money(r.amount)}</span></button></div>`}
function breakdown(parts,withSub){
  const max=Math.max(...parts.map(p=>p.value),1),t=parts.reduce((s,p)=>s+p.value,0);
  return parts.map(p=>{const lim=withSub&&S.sub[p.id];
    return `<div class="bd" data-cat="${p.id}" onclick="focusCat('${p.id}')" style="--c:${p.color}"><span class="e">${p.emoji}</span>
    <span class="n"><span>${p.name}</span><span class="muted small">${Math.round(p.value/t*100)}%${lim?` · 子预算 ${money(lim,0)}`:''}</span></span>
    <span class="a">${money(p.value)}</span>
    <div class="bar"><i style="width:${(lim?Math.min(100,p.value/lim*100):p.value/max*100).toFixed(1)}%;background:${lim&&p.value>lim?'var(--bad)':p.color}"></i></div></div>`}).join('');
}
function insightCmp(curA,curB,prevA,prevB,unit){
  const cur=catMap(inRange(curA,curB)),prev=catMap(inRange(prevA,prevB));let best=null;
  CATS.forEach(c=>{if(c.id==='home')return;const d=(cur[c.id]||0)-(prev[c.id]||0);if(!best||Math.abs(d)>Math.abs(best.d))best={c,d}});
  if(!best||Math.abs(best.d)<1)return `和上${unit}同期差不多，很稳`;
  return `${best.c.name}比上${unit}同期${best.d>0?'多':'少'}了 ${money(Math.abs(best.d))}`;
}
function topItems(rs){
  const m={};rs.forEach(r=>(r.items||[]).forEach(i=>{const k=i.name;m[k]=m[k]||{name:k,n:0,sum:0};m[k].n++;m[k].sum+=i.price}));
  return Object.values(m).sort((a,b)=>b.n-a.n||b.sum-a.sum).slice(0,10);
}

/* ---------- screens ---------- */
function vToday(){
  const rs=inRange(TODAY,TODAY),t=total(rs),parts=byCat(rs);
  const d=pd(TODAY),y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),n=dim(y,m);
  const [ms]=monthRange(y,m),before=total(records.filter(r=>r.date>=ms&&r.date<TODAY));
  const left=n-day+1,allow=Math.max(0,(S.budget-before)/left),mSpent=r2(before+t);
  const over=t>allow,mood=allow<=0||over?'sad':t<=allow*.75?'happy':'ok';
  const plump=Math.max(0,Math.min(1,(S.budget-mSpent)/S.budget)),stk=streak();
  const status=allow<=0?`<span class="chip bad">本月预算用完啦</span>`:over?`<span class="chip warn">超出 ${money(t-allow)}，明天省一点就好</span>`:`<span class="chip good">还能花 ${money(allow-t)}</span>`;
  return `

    const prevM=m===1?[y-1,12]:[y,m-1],[pa]=monthRange(...prevM),pb=addDays(pa,Math.max(0,elapsed-1));
    const top=topItems(rs);

    ${top.length?`<section class="card"><div class="card-h"><h2>超市商品 Top 10</h2><span class="muted small">来自扫描的小票</span></div>

  }catch(e){toast('连不上服务，检查地址和网络')}

// Shrink the photo before upload: receipts read fine at ~1600px, and it keeps uploads small.
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);const data=cv.toDataURL('image/jpeg',.85);res({preview:data,base64:data.split(',')[1]});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej({code:'image_rejected'})};
    img.src=url;
  });
}
const SCAN_ERR={
  unauthorized:'访问口令不对，去「预算」页的扫小票设置里检查。',forbidden_origin:'识别服务不允许这个网址访问，检查 Worker 里的 ALLOWED_ORIGIN。',
  bad_api_key:'识别服务里的 Anthropic API Key 不对或已失效。',rate_limited:'识别得太频繁了，等一会儿再试。',
  image_rejected:'这张图片读不了，换一张试试。',bad_image:'这张图片读不了，换一张试试。',refused:'这张图片没法识别，换一张试试。',
  too_long:'小票太长了，试试分两段拍。',network:'连不上识别服务，检查网络后再试。'
};
let scanCtl=null;
function onFile(inp){const f=inp.files&&inp.files[0];inp.value='';if(f)scanFile(f)}
async function scanFile(file){
  const c=scanCfg();if(!c.url||!c.token){toast('先在「预算」页设置扫小票服务');return}
  scanCtl?.abort();const ctl=new AbortController();scanCtl=ctl;
  const mine={stage:'loading',img:null,file};S.receipt=mine;S.selected=new Set();S.enter=true;render();
  const steps=['正在上传照片…','读取商店和日期…','逐行识别商品…','还原缩写、匹配分类…','快好了…'];let k=0;
  const iv=setInterval(()=>{const el=document.getElementById('scanStep');if(!el||S.receipt!==mine){clearInterval(iv);return}if(k<steps.length-1){el.textContent=steps[++k];replay(el,'bump')}},4000);
  let img=null;
  try{
    const sh=await shrink(file);img=sh.preview;mine.img=img;if(S.receipt===mine)render();
    let r;
    try{r=await fetch(c.url+'/scan',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','X-App-Token':c.token},body:JSON.stringify({image:sh.base64,mediaType:'image/jpeg'})})}
    catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'}}
    const res=await r.json().catch(()=>null);
    clearInterval(iv);if(S.receipt!==mine)return;
    if(!r.ok)throw {code:(res&&res.error)||'upstream'};
    if(!res||!res.is_receipt||!Array.isArray(res.items)||!res.items.length)throw {code:'not_receipt',message:res&&res.reason?String(res.reason):''};
    const items=res.items.filter(it=>it&&isFinite(parseFloat(it.price))).slice(0,80).map((it,i)=>{
      const raw=String(it.raw||it.name||'').trim().slice(0,60),ai=CAT[it.cat]?it.cat:'groc';
      return {i,raw,name:String(it.name||raw).trim().slice(0,40)||raw,price:Math.max(0,r2(parseFloat(it.price))),ai,cat:S.memory[raw]||ai,remembered:!!S.memory[raw]}});
    if(!items.length)throw {code:'not_receipt',message:''};
    const date=typeof res.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(res.date)&&res.date<=TODAY?res.date:TODAY;
    const sum=r2(items.reduce((s,i)=>s+i.price,0)),tot=parseFloat(res.total);
    S.receipt={stage:'result',img,file,store:String(res.store||'小票').trim().slice(0,30)||'小票',date,total:isFinite(tot)&&tot>0?r2(tot):sum,items};
    S.enter=true;buzz(15);render();
  }catch(e){
    clearInterval(iv);if(S.receipt!==mine)return;
    const code=e&&e.code;
    if(code==='cancelled'){S.receipt=null;render();return}
    const msg=code==='not_receipt'?('没认出这是一张小票'+(e.message?'：'+e.message:'')+'。'):(SCAN_ERR[code]||'这次没识别出来，可以再试一次。');
    S.receipt={stage:'error',img,file,msg,retry:!['image_rejected','bad_image','refused','unauthorized','forbidden_origin','bad_api_key'].includes(code)};render();
  }
}

  }

/* consecutive days whose non-rent spending stayed within that month's average daily budget */
function streak(){
  const capFor=s=>{const d=pd(s),y=d.getFullYear(),m=d.getMonth()+1,[a,b]=monthRange(y,m);
    return (S.budget-total(inRange(a,b).filter(r=>r.cat==='home')))/dim(y,m)};
  const dayVar=s=>total(inRange(s,s).filter(r=>r.cat!=='home'));
  if(!records.length)return 0;
  const first=records.reduce((a,r)=>r.date<a?r.date:a,TODAY);
  let d=dayVar(TODAY)<=capFor(TODAY)?TODAY:addDays(TODAY,-1),n=0;
  while(n<60&&d>=first&&dayVar(d)<=capFor(d)){n++;d=addDays(d,-1)}
  return n;
}
// Settle last month once: money left over goes into 小金库.
function checkSettle(){
  const [y,m]=ymOf(TODAY),[py,pm]=m===1?[y-1,12]:[y,m-1],key=`${py}-${pad(pm)}`;
  if(S.settled[key])return null;
  const [a,b]=monthRange(py,pm),rs=inRange(a,b);
  if(!rs.length)return null;
  const spent=total(rs),diff=r2(S.budget-spent);
  if(diff>0){S.vault=r2(S.vault+diff);S.vaultLog.push({month:key,amount:diff})}
  S.settled[key]={budget:S.budget,spent,diff};touchSettings();commit();
  return settleInfo(py,pm);
}
function settleInfo(y,m){
  const v=S.settled[`${y}-${pad(m)}`];if(!v)return null;
  const big=byCat(inRange(...monthRange(y,m))).find(p=>p.id!=='home');
  return {kind:v.diff>=0?'save':'over',month:m,amount:Math.abs(v.diff),spent:v.spent,budget:v.budget,vault:S.vault,bigName:big?big.name:'',real:true};
}
function previewSettle(kind){
  const keys=Object.keys(S.settled).sort().reverse(),hit=keys.find(k=>(S.settled[k].diff>=0)===(kind==='save'));
  if(hit){const [y,m]=hit.split('-').map(Number);showSettle(settleInfo(y,m));return}
  const amt=kind==='save'?123.45:86.2,[,m]=ymOf(TODAY);
  showSettle({kind,month:m,amount:amt,budget:S.budget,spent:kind==='save'?S.budget-amt:S.budget+amt,vault:r2(S.vault+(kind==='save'?amt:0)),bigName:'',real:false});
}
function showSettle(info){
  if(!info)return;
  const save=info.kind==='save',amt=info.amount;
  const conf=save&&!reduce()?[...Array(22)].map((_,i)=>`<i class="confetti" style="left:${(Math.random()*100).toFixed(1)}%;background:${CATS[i%CATS.length].color};animation-delay:${(Math.random()*2.4).toFixed(2)}s;animation-duration:${(2.2+Math.random()*1.6).toFixed(2)}s"></i>`).join(''):'';
  buzz(save?[10,60,10]:40);
  layer().innerHTML=`<div class="overlay ${save?'save':'over'}" role="dialog" aria-label="${info.month}月结算">${conf}
    <div class="stage" onclick="jumpPig(this)" title="戳一下">${save?[0,.33,.66,1].map(dl=>`<span class="c" style="animation-delay:${dl}s">$</span>`).join(''):''}${pig(!save)}</div>
    <div class="ov-k">${info.month}月${save?'省下了':'超支了一点点'}</div>
    <div class="ov-n" id="ovn">$0.00</div>
    <div class="ov-t">${save?`已经存进小金库，现在一共有 ${money(info.vault)}。小猪吃饱啦！`:`小猪哭了，不过没关系。${info.bigName?`${info.bigName}花得最多，下个月在这上面省一点`:'下个月省一点'}就补回来啦。`}</div>
    <div class="small muted">预算 ${money(info.budget,0)} · 实际花了 ${money(info.spent)}${info.real?'':' · 示例数字'}</div>
    <div class="btns"><button class="btn ghost" disabled>月报卡片 · 即将推出</button><button class="btn" onclick="closeLayer();render()">知道啦</button></div></div>`;
  const el=document.getElementById('ovn'),t0=performance.now(),dur=1100,still=reduce();
  const step=t=>{const p=still?1:Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);if(!el.isConnected)return;el.textContent=(save?'+':'-')+money(amt*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* ---------- interaction helpers ---------- */
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(p=8){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function replay(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function countTo(el,from,to,dec=2,delay=0,dur=600){
  el.dataset.cur=to;if(reduce()){el.textContent=money(to,dec);return}
  const id=(el._cid=(el._cid||0)+1),t0=performance.now()+delay;el.textContent=money(from,dec);
  const step=t=>{if(!el.isConnected||el._cid!==id)return;const p=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-p,3);
    el.textContent=money(from+(to-from)*e,dec);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step)}
function runCounts(sc){
  const all=S.enter||S.slide;
  sc.querySelectorAll('[data-count]').forEach(el=>{
    const has=el.dataset.from!==undefined;if(!all&&!has)return;
    countTo(el,has?+el.dataset.from:0,+el.dataset.count,+(el.dataset.dec||2),+(el.dataset.delay||0))})}
/* chart focus: tap a ring slice, legend chip or breakdown row to look at one category */
function focusCat(id){if(Date.now()-justDragged<300)return;S.focus=S.focus===id?null:id;buzz();hideTip();applyFocus(false)}

  const sc=document.getElementById('screen'),f=S.focus;
  sc.querySelectorAll('.seg').forEach(c=>{c.classList.toggle('dim',!!f&&c.dataset.cat!==f);c.classList.toggle('hi',!!f&&c.dataset.cat===f)});
  sc.querySelectorAll('.lg[data-cat],.bd[data-cat]').forEach(c=>{c.classList.toggle('dim',!!f&&c.dataset.cat!==f);c.classList.toggle('hi',!!f&&c.dataset.cat===f)});
  sc.querySelectorAll('.bstack i[data-cat]').forEach(c=>c.classList.toggle('dim',!!f&&c.dataset.cat!==f));
  sc.querySelectorAll('[data-cat-row]').forEach(c=>c.hidden=!!f&&c.dataset.catRow!==f);
  sc.querySelectorAll('.focus-bar').forEach(b=>{b.hidden=!f;if(f){b.style.setProperty('--c',CAT[f].color);b.firstElementChild.textContent=`只看 ${CAT[f].emoji} ${CAT[f].name}`}});
  const w=sc.querySelector('.ring-wrap');if(!w)return;
  const big=w.querySelector('.big'),sub=w.querySelector('.sub'),tot=+w.dataset.total,dec=+w.dataset.dec;
  const seg=f&&w.querySelector(`.seg[data-cat="${f}"]`),val=seg?+seg.dataset.v:tot;

}
/* tooltips: long-press (touch) or hover (mouse) a week bar or calendar day */
let tipEl=null,hoverEl=null,lp=null,lpShown=false;
function showTip(el){if(tipEl&&tipEl._for===el&&tipEl.isConnected)return;hideTip();const d=el.dataset.tipDate,rs=inRange(d,d),t=total(rs),parts=byCat(rs);
  const app=document.getElementById('app'),ar=app.getBoundingClientRect(),r=el.getBoundingClientRect();
  const tip=document.createElement('div');tip.className='tip';
  tip.innerHTML=`<b>${md(d)} 周${WD[wdIdx(d)]} · ${money(t)}</b>${parts.length?parts.slice(0,5).map(p=>`<div class="tr"><span><span class="dot" style="--c:${p.color}"></span>${p.name}</span><span class="num">${money(p.value)}</span></div>`).join(''):'<span>这天没有消费</span>'}`;
  app.appendChild(tip);
  const tw=tip.offsetWidth,th=tip.offsetHeight;let x=r.left+r.width/2-ar.left-tw/2;x=Math.max(8,Math.min(ar.width-tw-8,x));
  let y=r.top-ar.top-th-8;if(y<8)y=r.bottom-ar.top+8;
  tip.style.left=x+'px';tip.style.top=y+'px';tip._for=el;tipEl=tip;el.classList.add('lift');el.closest('.bars')?.classList.add('has-tip')}
function hideTip(){if(tipEl){tipEl.remove();tipEl=null}document.querySelectorAll('.lift').forEach(e=>e.classList.remove('lift'));document.querySelectorAll('.has-tip').forEach(e=>e.classList.remove('has-tip'))}

/* gestures: swipe rows, drag sheets down, swipe stats left/right */
let sw=null,gs=null,sd=null;
document.addEventListener('pointerdown',e=>{
  const row=e.target.closest('.swipe .row');
  document.querySelectorAll('.swipe.open').forEach(s=>{if(!row||s!==row.parentNode)s.classList.remove('open')});
  const sh=e.target.closest('.sheet');
  if(sh&&!e.target.closest('button,input')&&(e.target.closest('.sheet-top')||sh.scrollTop<=0)){sd={el:sh,y:e.clientY,dy:0};sh.style.transition='none';return}
  if(row){sw={row,x:e.clientX,y:e.clientY,dx:0,base:row.parentNode.classList.contains('open')?-84:0,drag:false};return}
  const tt=e.target.closest('[data-tip-date]');
  if(tt&&e.pointerType!=='mouse'){lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{showTip(tt);lpShown=true;buzz(6)},350)}}
  if(S.tab==='stats'&&e.target.closest('#screen')&&!e.target.closest('input,.seg'))gs={x:e.clientX,y:e.clientY};
});
document.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse')return;const t=e.target.closest('[data-tip-date]');
  if(t&&t!==hoverEl){hoverEl=t;showTip(t)}else if(!t&&hoverEl){hoverEl=null;hideTip()}
});
document.addEventListener('pointermove',e=>{
  if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>8){clearTimeout(lp.t);lp=null}
  if(sd){sd.dy=Math.max(0,e.clientY-sd.y);sd.el.style.transform=`translateY(${sd.dy}px)`;return}
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){sw.drag=true;sw.row.style.transition='none'}else{if(Math.abs(dy)>10)sw=null;return}}
  sw.dx=dx;sw.row.style.transform=`translateX(${Math.max(-120,Math.min(0,sw.base+dx))}px)`;
});
function endPointer(e){
  if(lp){clearTimeout(lp.t);lp=null}
  if(lpShown){lpShown=false;hideTip();justDragged=Date.now();gs=null;return}
  if(sd){const {el,dy}=sd;sd=null;el.style.transition='';if(dy>4)justDragged=Date.now();
    if(dy>110){closeLayer()}else el.style.transform='';return}
  if(sw){if(sw.drag){const t=sw.base+sw.dx;sw.row.style.transition='';sw.row.style.transform='';
      sw.row.parentNode.classList.toggle('open',t<-42);justDragged=Date.now();if(t<-42)buzz()}sw=null}
  if(gs&&e.type==='pointerup'){const dx=e.clientX-gs.x,dy=e.clientY-gs.y;
    if(Math.abs(dx)>70&&Math.abs(dy)<50){justDragged=Date.now();buzz();shift(dx<0?1:-1)}}
  gs=null;
}
document.addEventListener('pointerup',endPointer);
document.addEventListener('pointercancel',endPointer);

/* ---------- boot ---------- */
loadLocal();
S.enter=true;render();BOOTED=true;afterReady();
// Coming back to the app on a new day (or month): refresh dates, settle last month if needed.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;const t=ds(new Date());if(t===TODAY)return;
  const newMonth=monthOf(t)!==monthOf(TODAY);TODAY=t;S.statsDate=t;S.weekStart=mondayOf(t);S.ym=ymOf(t);
  if(!S.draft&&!S.receipt)render();
  if(newMonth){const st=checkSettle();if(st)setTimeout(()=>showSettle(st),400)}
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
